:root{
  --disp:'Barlow Condensed','Helvetica Neue',Arial,'Apple SD Gothic Neo',sans-serif;
  --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --paper:#EDE4D2; --ink:#4B648C; --ink-rgb:75,100,140; --paper-rgb:237,228,210;
  --sat:#9BB0C8; --sun:#C08E80; --sun-ink:#A9716A; --sat-ink:#6C88A8;
  --hair:rgba(var(--ink-rgb),.82);
  --dash:rgba(var(--ink-rgb),.26);
  --line:rgba(var(--ink-rgb),.34);
  --soft:rgba(var(--ink-rgb),.055);
  --numh:24px; --rowh:27px;
  --pad:28px;
  /* type scale: the 글씨 크기 option multiplies these by --fs-k */
  --fs-k:1; --num-size:13px; --evt-size:12.2px; --tag-size:9.6px;
  --mt-size:13px; --mm-size:10px; --ctext-size:14px; --note-size:13.5px;
}
/* ---------- the four papers: one block per theme ----------
   paper · ink · the two weekend inks · the pen, then the five Google secondary
   calendar inks (--cal-c0 … --cal-c4): calm hues far enough from that theme's
   --ink and --sun-ink to be told apart inside a cell and still ≥4:1 on its
   --paper. 기본 달력 (the primary calendar) keeps --ink; a secondary calendar
   takes the next free slot in the list. */
[data-theme="white"]{--paper:#FFFFFF;--ink:#111111;--ink-rgb:17,17,17;--paper-rgb:255,255,255;--sat:#9BB7D4;--sun:#D3A29A;--sun-ink:#BE7469;--sat-ink:#5F7F9E;--pen:rgba(196,98,72,.52);--cal-c0:#2E6B62;--cal-c1:#7B4A6E;--cal-c2:#6B5A1E;--cal-c3:#8A4A2C;--cal-c4:#3F4A8C}
[data-theme="cream"]{--paper:#EDE4D2;--ink:#4B648C;--ink-rgb:75,100,140;--paper-rgb:237,228,210;--sat:#9BB0C8;--sun:#C08E80;--sun-ink:#A9716A;--sat-ink:#6C88A8;--pen:rgba(75,100,140,.52);--cal-c0:#2A6A5E;--cal-c1:#7A3F63;--cal-c2:#66571B;--cal-c3:#8B4527;--cal-c4:#573E84}
[data-theme="olive"]{--paper:#A3AD77;--ink:#2E331F;--ink-rgb:46,51,31;--paper-rgb:163,173,119;--sat:#7E9C9A;--sun:#A8735F;--sun-ink:#7C4F3F;--sat-ink:#3F6160;--pen:rgba(244,240,224,.62);--cal-c0:#14483F;--cal-c1:#5E2436;--cal-c2:#1E3A66;--cal-c3:#5A3010;--cal-c4:#3B2A5E}
[data-theme="navy"]{--paper:#48516C;--ink:#C3B89B;--ink-rgb:195,184,155;--paper-rgb:72,81,108;--sat:#9DB3C9;--sun:#CFA096;--sun-ink:#D9AFA6;--sat-ink:#AEC5DA;--pen:rgba(232,217,178,.62);--cal-c0:#E8C57E;--cal-c1:#9AD0BC;--cal-c2:#C6B4E6;--cal-c3:#93C8E3;--cal-c4:#C8D98A}
html[data-fs="small"]{--fs-k:.88}
html[data-fs="large"]{--fs-k:1.14}
/* the quote option only takes the lines away; nothing else moves */
html[data-noquote] .cover-meta,html[data-noquote] .mquote{display:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* keep the scrollbar gutter reserved in every view so the top-right ≡ never shifts.
   the paper colour sits on <html> itself: iOS paints the strip behind the status
   bar from the root canvas, and with the colour only on <body> that strip kept
   the previous theme (the body's 400ms fade also left it a frame behind). */
html{scrollbar-gutter:stable;background-color:var(--paper);
  /* scrollIntoView / focus land above the bottom bar instead of under it */
  scroll-padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:calc(14px*var(--fs-k));line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  /* no background fade: it kept the status-bar strip on the old tint */
  transition:color .4s ease;
  overflow-x:hidden;
  /* no double-tap zoom delay on the calendar cells, no callout on long press */
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:none}
input::placeholder,textarea::placeholder{color:rgba(var(--ink-rgb),.32)}
::selection{background:rgba(var(--ink-rgb),.14)}
.app{min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top nav ---------- */
/* sticky bar stays full-bleed (edge to edge); its content box matches the calendar's */
/* the notch / dynamic island sits above the sticky bar in standalone */
.topnav{position:sticky;top:0;z-index:40;background:var(--paper);padding-top:env(safe-area-inset-top)}
.navin{
  width:100%;max-width:1260px;margin:0 auto;
  /* one gap for the whole bar: the breathing room between Dec. and ≡ is the same
     single value at every width, so the months spread up to the icon instead of
     leaving a hole before it */
  display:flex;align-items:center;gap:clamp(14px,4.5vw,58px);
  padding:16px var(--pad) 12px;
}
.iconbtn{
  /* the icon is sized from the month text's own font-size, so the ≡ glyph keeps the
     Jan.–Dec. height ratio of the reference at every width */
  --ifs:clamp(20px,1.85vw,26px);
  position:relative;
  font-size:var(--ifs);
  width:1.15em;height:1.15em;display:grid;place-items:center;border-radius:6px;
  color:var(--ink);opacity:.9;transition:background .2s,opacity .2s;flex:0 0 auto;
  /* optical alignment: the drawn glyph (not its padding box) meets the calendar's
     right edge, and its centre sits on the Jan.–Dec. cap-height centre */
  transform:translate(.13em,-1px);
}
.iconbtn svg{width:100%;height:100%}
.iconbtn::after{content:'';position:absolute;inset:-10px} /* keep a comfortable tap area */
.iconbtn:hover{background:var(--soft);opacity:1}
.months{
  display:flex;flex:1 1 auto;justify-content:space-between;align-items:flex-end;
  gap:clamp(7px,1.05vw,18px);
  /* the 12 months always fit the bar: no horizontal scroll or drag anywhere */
  overflow-x:hidden;scrollbar-width:none;padding-bottom:2px;min-width:0;
}
.months::-webkit-scrollbar{display:none}
.months button{
  font-family:var(--disp);font-style:italic;font-weight:600;
  font-size:clamp(15px,1.65vw,22px);line-height:1;letter-spacing:.02em;
  padding:3px 2px 4px;border-bottom:2px solid transparent;
  color:var(--ink);opacity:.66;white-space:nowrap;transition:opacity .18s,border-color .18s;
}
/* the first month starts flush with the calendar's left edge */
.months button:first-child{padding-left:0}
.months button:last-child{padding-right:0}
.months button:hover{opacity:.95}
.months button.on{opacity:1;border-bottom-color:var(--ink)}
.page{width:100%;max-width:1260px;margin:0 auto;padding:6px var(--pad) calc(150px + env(safe-area-inset-bottom));flex:1}

/* ---------- monthly ---------- */
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:18px 0 30px}
.mnum{font-family:var(--disp);font-style:italic;font-weight:700;font-size:calc(clamp(46px,7vw,80px)*var(--fs-k));line-height:.82;letter-spacing:.005em}
/* m / s week-start radio */
.wkstart{display:flex;align-items:center;gap:13px;padding-top:16px}
.wkstart label{display:flex;align-items:center;gap:5px;cursor:pointer;font-family:var(--disp);font-style:italic;font-weight:600;font-size:calc(12.5px*var(--fs-k));letter-spacing:.05em;line-height:1;opacity:.42;transition:opacity .16s}
.wkstart label:hover{opacity:.8}
.wkstart label:has(input:checked){opacity:1}
.wkstart input{-webkit-appearance:none;appearance:none;width:11px;height:11px;margin:0;border:1px solid rgba(var(--ink-rgb),.5);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:border-color .15s}
.wkstart input:checked{border-color:var(--ink)}
.wkstart input:checked::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--ink)}
/* ---------- event search: one small magnifier over a short hairline, left of m / s ---------- */
/* the trigger keeps the radio row's own line height, so the hairline hangs level with
   m / s at every font size; the paper sheet behind it does the searching */
.mhead{position:relative}
.mtools{display:flex;align-items:flex-start;gap:14px;flex:1 1 auto;justify-content:flex-end;min-width:0;padding-top:14px;margin-left:12px}
.mtools .wkstart{padding-top:0}
.msbtn{
  position:relative;display:flex;align-items:center;
  width:71px;height:1em;padding:0 0 4px;box-sizing:content-box;
  font-size:calc(12.5px*var(--fs-k));line-height:1;
  color:var(--ink);border-bottom:1px solid var(--line);
  transition:border-color .16s;
}
.msbtn .mag{width:1.04em;height:1.04em;flex:0 0 auto;opacity:.5;transition:opacity .16s}
.msbtn:hover{border-bottom-color:rgba(var(--ink-rgb),.62)}
.msbtn:hover .mag,.msbtn:focus-visible .mag{opacity:.85}
.msbtn::after{content:'';position:absolute;inset:-12px -8px -10px -8px} /* comfortable tap area */
/* results: a plain list under the query line, scrolled inside the paper sheet */
.sresults{width:100%;margin-top:6px;border-top:1px solid var(--hair);max-height:min(56dvh,430px);overflow-y:auto}
.sres{display:flex;align-items:baseline;gap:6px;width:100%;padding:10px 2px;text-align:left;border-bottom:1px dotted var(--dash);font-size:calc(12.5px*var(--fs-k));line-height:1.25}
.sres:last-child{border-bottom:0}
.sres:hover{background:var(--soft)}
.sres .sr-d{flex:0 0 auto;font-family:var(--disp);font-style:italic;font-weight:600;font-size:calc(12px*var(--fs-k));letter-spacing:.03em;font-variant-numeric:tabular-nums}
.sres .sr-y{font-weight:400;opacity:.62;margin-right:2px}
.sres .sr-w{flex:0 0 auto;font-size:calc(10px*var(--fs-k));opacity:.5}
.sres .sr-t{flex:0 0 auto;font-size:calc(10.5px*var(--fs-k));opacity:.6;font-variant-numeric:tabular-nums}
.sres .sr-b{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6;flex:0 0 auto;align-self:center}
.sres .sr-l{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .sr-r{flex:0 0 auto;font-size:calc(9px*var(--fs-k));letter-spacing:.02em;opacity:.6;border:1px solid var(--dash);border-radius:999px;padding:0 5px;line-height:15px}
.sres.sr-go{opacity:.8}
.sres.sr-go .sr-gl{font-size:calc(11px*var(--fs-k));letter-spacing:.01em;opacity:.85}
.sres .sr-a{margin-left:auto;font-size:calc(11px*var(--fs-k));opacity:.5;font-style:normal}
/* a holiday, a traditional day or a 24절기: the name wears the ink the calendar gives it */
.sres.lb .sr-d{font-size:calc(11px*var(--fs-k));letter-spacing:.02em}
.sres.lb .sr-l{font-weight:500}
.sres.lb.k-hol .sr-l,.sres.lb.k-fest .sr-l{color:var(--sun-ink)}
.sres.lb.k-term .sr-l{color:rgba(var(--ink-rgb),.55)}
.sres.lb.k-hol .sr-r,.sres.lb.k-fest .sr-r{opacity:.76}
.sr-empty{padding:16px 2px;font-size:calc(11.5px*var(--fs-k));opacity:.5}
@media (max-width:760px){
  .mtools{gap:10px;padding-top:10px;margin-left:8px}
  .msbtn{width:61px}
}

/* ---------- repeat selector in the day modal ---------- */
.reprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.dedit .reprow{flex:1 0 100%;margin-top:8px}
.rp{font-family:var(--ui);font-size:calc(11px*var(--fs-k));line-height:1;letter-spacing:.01em;padding:5px 10px;border:1px solid rgba(var(--ink-rgb),.24);border-radius:999px;color:var(--ink);opacity:.55;transition:opacity .15s,background .15s,border-color .15s}
.rp:hover{opacity:.85}
.rp[aria-checked="true"]{opacity:1;background:rgba(var(--ink-rgb),.13);border-color:rgba(var(--ink-rgb),.62)}
.dedit{flex-wrap:wrap}
.ditem .drep{font-size:calc(9px*var(--fs-k));letter-spacing:.02em;opacity:.6;border:1px solid var(--dash);border-radius:999px;padding:0 4px;margin-left:6px;vertical-align:1px}
.led{width:6px;height:6px;border-radius:50%;background:rgba(var(--ink-rgb),.3);flex:0 0 auto}
.led.on{background:#6FA37A;box-shadow:0 0 0 3px rgba(111,163,122,.18)}
body[data-theme="olive"] .led.on{background:#3E6B48;box-shadow:0 0 0 3px rgba(62,107,72,.18)}
.sync-btn{border-bottom:1px solid rgba(var(--ink-rgb),.45);padding-bottom:1px;opacity:.9;margin-left:auto;font-size:calc(11.5px*var(--fs-k));white-space:nowrap}
.sync-btn:hover{opacity:1;border-bottom-color:var(--ink)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:7px}
.dow span{text-align:center;font-family:var(--disp);font-style:italic;font-weight:700;font-size:calc(11.5px*var(--fs-k));letter-spacing:.16em}
.dow span.sat{color:var(--sat-ink);opacity:.78}
.dow span.sun{color:var(--sun-ink);opacity:.85}
/* the month column: the motto hangs at the bottom of the calendar above the year bar */
.mcol{display:flex;flex-direction:column;min-height:calc(100dvh - 186px)}
.mquote{margin-top:auto;padding:26px var(--pad) 4px;text-align:center;font-family:var(--disp);font-style:italic;font-size:calc(11.5px*var(--fs-k));line-height:1.5;letter-spacing:.1em;opacity:.62;color:var(--ink)}

.cal{border-bottom:1px solid var(--hair)}
.week{
  position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  height:calc(var(--numh) + var(--rowh)*3 + 9px);
  border-top:1px solid var(--hair);
}
/* overflow stays visible so a hand-drawn circle around a day number is
   never cut off at the cell edge; the top padding keeps its top stroke clear
   of the week divider line above */
.cell{position:relative;padding:6px 7px 0;cursor:pointer;transition:background .16s;overflow:visible}
.cell:hover{background:var(--soft)}
.cell.pad{cursor:default}
.cell.pad:hover{background:none}
.dnum{font-family:var(--ui);font-weight:500;font-size:calc(var(--num-size)*var(--fs-k));letter-spacing:-.005em;height:var(--numh);display:flex;align-items:center;font-variant-numeric:tabular-nums;overflow:visible}
.cell.sat .dnum{color:var(--sat-ink);opacity:.8}
.cell.sun .dnum{color:var(--sun-ink)}
/* holidays wear the same ink as Sunday, number and label alike */
.cell.hol .dnum{color:var(--sun-ink);opacity:1}
/* one label slot after the day number: an official holiday, a traditional day, a
   24절기 name, or the lunar 5-day date. The wide view gets the long wording and the
   phone the short one, as the holiday label always did. */
.dnum .ltag{margin-left:6px;font-size:calc(var(--tag-size)*var(--fs-k));font-weight:600;letter-spacing:-.005em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dnum .ltag .s{display:none}
.dnum .hol{color:var(--sun-ink)}
.dnum .lf{color:var(--sun-ink);opacity:.72}
.dnum .st{color:var(--ink);opacity:.5;font-weight:500}
.dnum .ld{color:var(--ink);opacity:.42;font-weight:400;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.evts{display:flex;flex-direction:column}
.evt{
  height:var(--rowh);display:flex;align-items:center;gap:5px;
  font-size:calc(var(--evt-size)*var(--fs-k));line-height:1;
}
.evt .bul{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45;flex:0 0 auto}
.evt .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt .tm{font-variant-numeric:tabular-nums;opacity:.55;font-size:calc(10.5px*var(--fs-k));flex:0 0 auto;letter-spacing:.02em}
.evt.g .bul{background:var(--sat);opacity:.95}
/* a secondary Google calendar paints the whole line in its own ink, dot included */
.evt.csec .bul{background:currentColor;opacity:.85}
.evt.done .t{opacity:.4;text-decoration:line-through}

/* ---------- yearly ---------- */
.yhead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:18px 0 16px;flex-wrap:wrap}
.yhead-row .legend{margin-top:0}
.ytitle{font-family:var(--disp);font-style:italic;font-weight:700;font-size:calc(clamp(32px,4.4vw,46px)*var(--fs-k));line-height:1;letter-spacing:.005em}
.ytitle small{font-family:var(--disp);font-style:italic;font-weight:300;font-size:calc(clamp(15px,1.7vw,22px)*var(--fs-k));letter-spacing:.06em;margin-left:12px;opacity:.75}
.ywrap{display:grid;grid-template-columns:minmax(0,1fr);gap:34px;align-items:start}
.ygrid{border-bottom:1px solid var(--hair)}
.ymat{display:grid;grid-template-columns:34px repeat(12,minmax(46px,1fr));grid-auto-rows:25px;min-width:720px;border-bottom:1px solid var(--hair);margin-bottom:-1px}
.yscroll{overflow-x:auto;scrollbar-width:thin}
.yh{display:flex;align-items:baseline;gap:4px;justify-content:center;padding:0 2px 7px;height:26px;font-family:var(--disp);font-style:italic;font-size:calc(12.5px*var(--fs-k));letter-spacing:.05em;cursor:pointer;border-bottom:1px solid var(--hair);white-space:nowrap;transition:opacity .15s}
.yh:hover{opacity:.6}
.yh b{font-weight:700}
.yh span{font-weight:400;opacity:.9}
.yh.corner{cursor:default;border-bottom:1px solid var(--hair)}
.yrow-lab{display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:calc(10.5px*var(--fs-k));font-variant-numeric:tabular-nums;opacity:.62;border-bottom:1px dotted var(--dash)}
.ycell{position:relative;display:flex;align-items:center;justify-content:center;height:100%;border-bottom:1px dotted var(--dash);border-left:1px solid rgba(var(--ink-rgb),.3);cursor:pointer}
.ycell:hover{background:var(--soft)}
.ycell.hard{border-bottom:1px solid var(--hair)}
.ycell.yoff{cursor:default;border-bottom-color:rgba(var(--ink-rgb),.10)}
.wd{width:4.5px;height:4.5px;border-radius:50%}
.wd.sat{background:var(--sat)}
.wd.sun{background:var(--sun)}
.emk{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;width:11px;height:1.5px;background:rgba(var(--ink-rgb),.45);border-radius:1px}

/* check box and × — the checklist rows and the day modal use these */
.cb{width:15px;height:15px;border:1.3px solid var(--hair);flex:0 0 auto;margin-top:3px;display:grid;place-items:center;transition:background .15s}
.cb i{width:8px;height:4px;border-left:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);transform:rotate(-45deg);opacity:0}
.cb.on i{opacity:1}
.del{width:calc(20px*var(--fs-k));height:calc(20px*var(--fs-k));flex:0 0 auto;display:grid;place-items:center;opacity:.3;transition:opacity .15s;font-size:calc(15px*var(--fs-k));color:rgba(var(--ink-rgb),.55)}
.del:focus{opacity:1}
.legend{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:calc(10.5px*var(--fs-k));color:rgba(var(--ink-rgb),.55)}
.legend span{display:flex;align-items:center;gap:5px}

/* ---------- memo ---------- */
.memotabs{display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--hair);margin-top:18px}
.mtab{font-family:var(--disp);font-style:italic;font-weight:400;font-size:calc(17px*var(--fs-k));letter-spacing:.05em;color:var(--ink);opacity:.55;padding:2px 1px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:opacity .18s,border-color .18s}
.mtab:hover{opacity:.85}
.mtab.on{opacity:1;font-weight:600;border-bottom-color:var(--ink)}
.mtab .n{font-family:var(--ui);font-style:normal;font-weight:400;font-size:calc(10px*var(--fs-k));letter-spacing:0;opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
.memo{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-areas:"side editor" "foot editor";gap:0 34px;margin-top:20px;align-items:start}
.side{grid-area:side;border-right:1px solid var(--dash);padding-right:26px;display:flex;flex-direction:column;min-height:0}
.editor{grid-area:editor;min-width:0}
.foot{grid-area:foot;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.foot .backup{margin-top:0}
/* the check / memo search: the calendar's magnifier inside the same hairline the
   field rides on, with a × that only appears once there is something to clear */
.msearch{display:flex;align-items:center;gap:7px;width:100%;border-bottom:1px solid var(--dash);padding:4px 0 5px;margin-bottom:10px}
.msearch .mag{width:calc(13px*var(--fs-k));height:calc(13px*var(--fs-k));flex:0 0 auto;opacity:.42;transition:opacity .16s}
.msearch:focus-within .mag{opacity:.8}
.search{flex:1 1 auto;min-width:0;width:auto;margin:0;padding:0;font-size:calc(12.5px*var(--fs-k));line-height:1.25}
.msearch .sx{flex:0 0 auto;width:calc(19px*var(--fs-k));height:calc(19px*var(--fs-k));display:grid;place-items:center;font-size:calc(14px*var(--fs-k));line-height:1;opacity:.4;transition:opacity .16s}
.msearch .sx:hover{opacity:.9}
.newmemo{display:flex;align-items:center;gap:6px;width:100%;padding:9px 10px;border:1px solid var(--dash);font-size:calc(12.5px*var(--fs-k));margin-bottom:12px;transition:border-color .2s,background .2s}
.newmemo:hover{border-color:var(--hair);background:var(--soft)}
.mlist{display:flex;flex-direction:column;gap:1px;max-height:calc(100dvh - 452px);overflow-y:auto}
.mrow{position:relative;padding:9px 22px 9px 10px;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mrow.on{border-left-color:var(--ink);background:var(--soft)}
.mrow .mt{font-size:calc(var(--mt-size)*var(--fs-k));font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mm{display:flex;gap:6px;align-items:center;font-size:calc(var(--mm-size)*var(--fs-k));letter-spacing:.04em;opacity:.5;margin-top:3px}
.mrow .mm .tpl{font-family:var(--disp);font-style:italic;font-size:calc(11px*var(--fs-k));letter-spacing:.04em}
/* iOS Safari gives the first tap to :hover when a hover rule changes what
   sits under the finger (here a × that only appeared on hover), which is
   why a list row used to need two taps. Hover styling now exists only on
   devices with a real pointer; on touch the × is always there, lightly. */
.mrow .mx{position:absolute;right:2px;top:8px;width:calc(18px*var(--fs-k));height:calc(18px*var(--fs-k));display:grid;place-items:center;opacity:.45;font-size:calc(14px*var(--fs-k));touch-action:manipulation}
@media (hover:hover){
  .mrow:hover{background:var(--soft)}
  .mrow .mx{opacity:0}
  .mrow:hover .mx{opacity:.5}
  .mrow .mx:hover{opacity:1}
}
.backup{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:16px;padding:9px;border:1px solid var(--dash);font-size:calc(12px*var(--fs-k))}
.backup:hover{border-color:var(--hair);background:var(--soft)}
/* ≡ menu footer: backup · account · google calendar sync */
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border:1px solid var(--dash);font-size:calc(12px*var(--fs-k));text-align:left;transition:border-color .2s,background .2s}
.acct:hover{border-color:var(--hair);background:var(--soft)}
.acct .lab{font-size:calc(10.5px*var(--fs-k));letter-spacing:.03em;opacity:.55;white-space:nowrap}
.acct .mail{font-size:calc(11.5px*var(--fs-k));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}
.acct .mail.none{opacity:.4}
.syncbox{margin-top:4px;padding-top:10px;border-top:1px solid var(--dash);display:flex;flex-direction:column;gap:8px}
.syncrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:calc(11.5px*var(--fs-k));letter-spacing:.01em;color:rgba(var(--ink-rgb),.62)}
.syncrow .state{opacity:.9}
.holrow{display:flex;align-items:center;gap:6px;font-size:calc(10.5px*var(--fs-k));letter-spacing:.01em;color:rgba(var(--ink-rgb),.6);cursor:pointer}
.holrow input{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin:0;border:1.2px solid rgba(var(--ink-rgb),.5);display:grid;place-items:center;cursor:pointer}
.holrow input:checked{border-color:var(--ink)}
.holrow input:checked::after{content:'';width:6px;height:3px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg) translate(0,-1px)}
/* ---------- the connected account's calendars: checkbox · colour · name ---------- */
.callist{display:flex;flex-direction:column;gap:1px;margin:-1px 0 0 18px;max-width:100%}
.calrow{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:calc(10.5px*var(--fs-k));letter-spacing:.01em;color:rgba(var(--ink-rgb),.62);cursor:pointer;min-width:0}
.calrow input[type=checkbox]{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin:0;border:1.2px solid rgba(var(--ink-rgb),.5);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.calrow input[type=checkbox]:checked{border-color:var(--ink)}
.calrow input[type=checkbox]:checked::after{content:'';width:6px;height:3px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg) translate(0,-1px)}
.calrow .cdot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:var(--ink)}
.calrow .cdot.ink{opacity:.62}
/* a shared calendar's colour: the dot itself, tapped for the app's own colour
   grid (never the phone's native picker) */
.calrow .cdot.pick{-webkit-appearance:none;appearance:none;padding:0;margin:0;border:1px solid rgba(var(--ink-rgb),.28);background:var(--c);cursor:pointer;outline:1.5px solid transparent;outline-offset:2px;transition:border-color .15s,outline-color .15s}
.calrow .cdot.pick:hover{border-color:rgba(var(--ink-rgb),.6)}
.calrow .cdot.pick:focus-visible{outline-color:var(--ink)}
.calrow .cdot.pick.on{outline-color:rgba(var(--ink-rgb),.72)}
.calrow .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* empty editor: only a centered + */
.mempty-editor{display:grid;place-items:center;min-height:min(56vh,440px)}
.plusbtn{width:66px;height:66px;border:0;border-radius:0;background:none;display:grid;place-items:center;font-size:calc(30px*var(--fs-k));line-height:1;font-weight:300;color:rgba(var(--ink-rgb),.55);transition:color .2s,opacity .2s}
.plusbtn:hover{background:none;color:var(--ink)}
/* ---------- backup category picker ---------- */
.bscopes{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px;padding-bottom:11px;border-bottom:1px solid var(--dash)}
.bscope{display:flex;align-items:center;gap:6px;font-size:calc(11.5px*var(--fs-k));letter-spacing:.01em;color:rgba(var(--ink-rgb),.72);cursor:pointer;-webkit-tap-highlight-color:transparent}
.bscope input{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin:0;border:1.2px solid rgba(var(--ink-rgb),.45);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.bscope input:checked{border-color:var(--ink)}
.bscope input:checked::after{content:'';width:6px;height:3px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg) translate(0,-1px)}
.btn[disabled]{opacity:.38;cursor:default}

/* ---------- check · memo under the monthly calendar ---------- */
.minline{margin-top:22px;border-bottom:1px solid var(--hair);padding-bottom:2px}
.minline .memotabs{margin-top:0}
.minline .memo{margin-top:14px}
.minline .mlist{max-height:min(36vh,300px);border-bottom:1px solid var(--hair);padding-bottom:2px}
.minline .editor{border-top:0;margin-top:16px;padding-top:0;scroll-margin-top:calc(64px + env(safe-area-inset-top))}
.minline .mempty-editor{min-height:min(30vh,220px)}
.minline .canvas{min-height:0}
.minline .ruled textarea,.minline .ruled .mview{min-height:calc(var(--rh)*10)}
.minline .cbar{margin-top:10px}
.ehead{display:flex;align-items:center;gap:12px;margin-bottom:4px;min-width:0}
.eback{display:none}
/* flex:1 1 0 + width:100% keeps a 40-character title inside the column instead of
   letting the input's intrinsic size stretch the whole page sideways */
.etitle{flex:1 1 0;width:100%;max-width:100%;min-width:0;box-sizing:border-box;font-family:var(--disp);font-style:italic;font-weight:600;font-size:calc(30px*var(--fs-k));line-height:1.1;letter-spacing:.01em;padding:2px 0;border-bottom:1px solid transparent}
.etitle:focus{border-bottom-color:var(--dash)}
.saved{font-size:calc(10px*var(--fs-k));letter-spacing:.05em;opacity:.45;white-space:nowrap}
.canvas{position:relative;min-height:420px}

/* ruled note sheet */
.sheet{position:relative;border-top:0}
.ruled{position:relative;min-height:calc(var(--rh)*16)}
.ruled textarea{
  position:relative;width:100%;height:auto;overflow:hidden;min-height:calc(var(--rh)*16);
  font-size:calc(var(--note-size)*var(--fs-k));line-height:var(--rh);padding:0;letter-spacing:.005em;
  resize:none;display:block;background:transparent;
}
.ruled .mview{font-size:calc(var(--note-size)*var(--fs-k));line-height:var(--rh)}

/* checklist */
.prog{font-size:calc(11px*var(--fs-k));letter-spacing:.05em;opacity:.6;font-variant-numeric:tabular-nums;white-space:nowrap}
.cbar{height:2px;background:rgba(var(--ink-rgb),.14);margin:12px 0 2px;max-width:660px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.clist{max-width:660px;margin-top:4px}
.crow{display:flex;align-items:flex-start;gap:10px;padding:11px 0 10px;border-bottom:1px dotted var(--dash);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.crow .cb{margin-top:1px}
.ctext{flex:1;min-width:0;font-size:calc(var(--ctext-size)*var(--fs-k));line-height:1.55;padding:1px 0}
.crow.done .ctext{opacity:.4;text-decoration:line-through}
.cdel{width:calc(22px*var(--fs-k));height:calc(22px*var(--fs-k));flex:0 0 auto;display:grid;place-items:center;font-size:calc(15px*var(--fs-k));color:rgba(var(--ink-rgb),.5);opacity:.45;transition:opacity .15s;touch-action:manipulation}
.cdel:focus{opacity:1}
@media (hover:hover){
  .cb:hover{background:var(--soft)}
  .cdel{opacity:0}
  .crow:hover .cdel{opacity:1}
}
.cadd{display:flex;gap:8px;align-items:center;max-width:660px;margin-top:14px;border-bottom:1px solid var(--dash);padding-bottom:6px}
.cadd input{flex:1;font-size:calc(13.5px*var(--fs-k));min-width:0}
.cadd button{align-self:stretch;display:grid;place-items:center;font-family:var(--disp);font-style:italic;font-weight:600;font-size:calc(17px*var(--fs-k));line-height:1;opacity:.6;padding:0 4px}
.cadd button:hover{opacity:1}

/* ---------- bottom bar: ⌂ · year · theme disc ----------
   Both discs live inside the bar instead of floating over the page: a floating
   button used to steal taps from 검색 / ＋ new / the last week's events when the
   calendar grew tall enough to reach it. In the bar they cover nothing. */
.yearbar{
  position:fixed;left:0;right:0;bottom:0;z-index:44;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px var(--pad) calc(7px + env(safe-area-inset-bottom));
  background:var(--paper);border-top:1px solid var(--hair);
  box-shadow:0 -10px 26px rgba(0,0,0,.05);
}
.yb-switch{display:flex;align-items:center;gap:1px;flex:1 1 auto;justify-content:center}
.yb-step{width:40px;height:34px;display:grid;place-items:center;font-size:20px;line-height:1;opacity:.68;border-radius:6px;transition:opacity .18s,background .18s}
.yb-step:hover,.yb-step:focus-visible{opacity:1;background:var(--soft)}
.yb-year{font-family:var(--disp);font-style:italic;font-weight:700;font-size:17px;letter-spacing:.12em;min-width:60px;text-align:center;font-variant-numeric:tabular-nums;padding:4px 7px;border-radius:6px;-webkit-tap-highlight-color:transparent;transition:background .18s,opacity .18s}
.yb-year:hover,.yb-year:focus-visible{background:var(--soft)}

/* ---------- year wheel (vertical drag / scroll picker above the bottom bar) ---------- */
.ypop-scrim{position:fixed;inset:0;z-index:46;background:rgba(var(--paper-rgb),.66);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);display:none}
.ypop-scrim.on{display:block;animation:fade .16s ease}
/* the wheel sits in a full-width flex layer: the layer's justify-content alone
   decides its x. The old left:50%/translateX(-50%) put the box at left:50% and
   relied on a transform for the other half — the open animation (rise ends with
   transform:none) and iOS Safari's own timing dropped that transform, so the box
   hung half its width to the right of the year button. A flex layer plus an
   opacity-only open cannot shift it. */
.ypop-layer{position:fixed;left:0;right:0;bottom:0;z-index:47;display:none;justify-content:center;align-items:flex-end;pointer-events:none;padding-bottom:60px}
.ypop-layer.on{display:flex}
.ypop{position:relative;flex:0 0 auto;width:112px;pointer-events:auto;background:var(--paper);border:1px solid var(--hair);box-shadow:0 18px 40px rgba(0,0,0,.18);animation:fade .16s ease}
.ywheel{position:relative;height:114px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;cursor:grab;outline:none}
.ywheel::-webkit-scrollbar{display:none}
.ywheel.grab{cursor:grabbing}
.yitem{height:38px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--disp);font-style:italic;font-weight:400;font-size:calc(17px*var(--fs-k));letter-spacing:.1em;font-variant-numeric:tabular-nums;color:rgba(var(--ink-rgb),.65);transition:color .16s;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.yitem.on{color:var(--ink);font-weight:700}
.ypad{height:38px}
.yband{position:absolute;left:0;right:0;top:38px;height:38px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);pointer-events:none;z-index:1}
.yfade{position:absolute;left:0;right:0;height:38px;pointer-events:none;z-index:2}
.yfade-t{top:0;background:linear-gradient(to bottom,rgba(var(--paper-rgb),.82),rgba(var(--paper-rgb),0))}
.yfade-b{bottom:0;background:linear-gradient(to top,rgba(var(--paper-rgb),.82),rgba(var(--paper-rgb),0))}
.noscript{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 24px;text-align:center}
.noscript .ns-year{font-family:var(--disp);font-style:italic;font-weight:700;font-size:clamp(56px,15vw,130px);line-height:.8;letter-spacing:-.015em}
.noscript .ns-sub{font-family:var(--disp);font-style:italic;font-weight:300;font-size:clamp(15px,4.4vw,30px);letter-spacing:.12em;line-height:1.2}
.noscript p{font-size:12px;opacity:.55;max-width:330px;line-height:1.7;margin:6px 0 0}

/* ---------- cover ---------- */
.cover{min-height:100dvh;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:calc(34px + env(safe-area-inset-top)) 24px calc(34px + env(safe-area-inset-bottom));position:relative;cursor:pointer}
/* the open space between the eyebrow and the swatches, and the wordmark centred inside it */
.cover-mid{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.cover-inner{display:flex;flex-direction:column;align-items:center;max-width:100%}
.cover-word1,.cover-word2{font-family:var(--disp);font-style:italic;font-weight:300;font-size:calc(clamp(24px,3.8vw,42px)*var(--fs-k));line-height:1;letter-spacing:.12em;text-indent:.12em;white-space:nowrap}
.cover-word2{margin-top:clamp(4px,.8vw,10px)}
.cover-meta{width:100%;text-align:center;font-family:var(--disp);font-style:italic;font-weight:400;font-size:calc(11px*var(--fs-k));letter-spacing:.28em;opacity:.45;text-transform:uppercase}
.cover-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.swatches{display:flex;gap:12px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(var(--paper-rgb),.0);box-shadow:0 0 .0 1px rgba(var(--ink-rgb),.18) inset;transition:transform .18s,box-shadow .18s}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 1.5px var(--paper),0 0 0 3px var(--ink)}
.cover-yearsw{display:flex;align-items:center;gap:14px;font-family:var(--disp);font-style:italic;font-size:calc(13px*var(--fs-k));letter-spacing:.16em;opacity:.55}
.cover-yearsw button{opacity:.7;font-size:calc(16px*var(--fs-k));line-height:1;padding:2px 4px}
.cover-yearsw button:hover{opacity:1}
.cover-yearsw .ysw-year{font-family:var(--disp);font-style:italic;font-weight:400;font-size:calc(13px*var(--fs-k));letter-spacing:.16em;opacity:.9;padding:2px 3px}
.enter-hint{font-size:calc(10px*var(--fs-k));letter-spacing:.3em;opacity:.4;text-transform:uppercase;font-family:var(--disp);font-style:italic}

/* ---------- modal / sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.32);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal{background:var(--paper);color:var(--ink);width:min(520px,100%);max-height:88dvh;overflow-y:auto;padding:26px 26px 22px;border-radius:3px;box-shadow:0 24px 60px rgba(0,0,0,.22);animation:rise .22s ease}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px}
.modal-h .d{font-family:var(--disp);font-style:italic;font-weight:700;font-size:calc(34px*var(--fs-k));line-height:1;letter-spacing:.02em}
.modal-h .dw{font-family:var(--disp);font-style:italic;font-size:calc(12px*var(--fs-k));letter-spacing:.2em;opacity:.55;margin-left:9px;vertical-align:6px}
.dhol{font-size:calc(11.5px*var(--fs-k));letter-spacing:.02em;color:var(--sun-ink);margin-top:5px}
.x{font-size:calc(20px*var(--fs-k));line-height:1;opacity:.45;padding:2px 4px}
.x:hover{opacity:1}
/* ---------- search sheet: one ruled query line, the results on paper below it ---------- */
.modal.smodal{width:min(560px,100%)}
.smfield{display:flex;align-items:center;gap:8px;margin:16px 0 0;padding-bottom:7px;border-bottom:1px solid rgba(var(--ink-rgb),.55)}
.smfield .mag{width:calc(14px*var(--fs-k));height:calc(14px*var(--fs-k));flex:0 0 auto;opacity:.5}
.smfield input{flex:1 1 auto;min-width:0;height:26px;padding:0;font-family:var(--ui);font-size:calc(13.5px*var(--fs-k));letter-spacing:.005em;line-height:1;background:transparent;border:0;outline:none;color:inherit}
.smfield .sx{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;font-size:calc(15px*var(--fs-k));line-height:1;opacity:.4}
.smfield .sx:hover{opacity:.9}
.dlist{margin:16px 0 0}
.ditem{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dotted var(--dash);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ditem .time{font-family:var(--disp);font-style:italic;font-size:calc(12px*var(--fs-k));letter-spacing:.05em;opacity:.6;min-width:44px;padding-top:2px;font-variant-numeric:tabular-nums}
.ditem .body{flex:1;min-width:0;font-size:calc(13.5px*var(--fs-k));line-height:1.4;cursor:pointer}
@media (hover:hover){.ditem .body:hover{opacity:.62}}
/* inline edit of one event: same 36px line as the 일정 추가 row below it */
.dedit{display:flex;gap:8px;align-items:flex-end;padding:8px 0 10px;border-bottom:1px dotted var(--dash);animation:fade .14s ease}
.dedit .grow{flex:1 1 auto;min-width:0;height:36px;font-size:calc(13px*var(--fs-k));border-bottom:1px solid var(--dash);padding:0}
.dedit .btn{font-size:calc(12.5px*var(--fs-k));padding:7px 12px}
.dedit .btn.primary{padding:7px 14px}
.ditem.done .body{opacity:.4;text-decoration:line-through}
.ditem .src{font-size:calc(9px*var(--fs-k));letter-spacing:.08em;opacity:.4;font-family:var(--disp);font-style:italic;border:1px solid var(--dash);border-radius:2px;padding:0 3px;margin-left:6px;vertical-align:1px}
.ditem .del{opacity:.3}
/* a calendar she can only read: the row stays visible, the pen and the × do not act */
.ditem.ro .body{cursor:default}
.ditem.ro .del{opacity:.12}
.ditem .dcal{font-size:calc(9.5px*var(--fs-k));letter-spacing:.02em;opacity:.72;margin-left:6px;white-space:nowrap;vertical-align:1px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* a one-line answer to a tap that cannot go through (read-only calendar etc.) */
.dayhint{font-size:calc(11px*var(--fs-k));letter-spacing:.01em;color:var(--sun-ink);padding:8px 0 0}
@media (hover:hover){.ditem:hover .del{opacity:.6}}
/* one baseline for the whole row: the clock cell and the title share the same
   36px height and bottom rule, and the 추가 button sits on that same line */
.addrow{display:flex;gap:8px;margin-top:16px;align-items:flex-end}
/* the time cell is a plain paper button, not an <input type=time>: iOS paints that
   control as a white box and opens its own white/blue wheel over the page, so the
   clock icon is drawn here and the button opens the in-app paper picker instead.
   It reads --:-- until a time is set. */
.time-wrap{position:relative;display:flex;align-items:center;flex:0 0 96px;width:96px;height:36px;min-width:0;border-bottom:1px solid var(--dash)}
.time-wrap .clock{position:absolute;left:0;top:50%;transform:translateY(-50%);width:12px;height:12px;flex:0 0 auto;color:rgba(var(--ink-rgb),.5);pointer-events:none}
.time-wrap .tbtn{flex:1 1 auto;width:100%;min-width:0;height:36px;display:block;text-align:left;font-family:var(--ui);font-style:normal;font-weight:400;font-size:calc(12.5px*var(--fs-k));letter-spacing:0;line-height:36px;padding:0 0 0 16px;border:0;background:transparent;font-variant-numeric:tabular-nums;cursor:pointer;color:inherit;white-space:nowrap;overflow:hidden;-webkit-tap-highlight-color:transparent}
.addrow .time-wrap .tbtn:hover,.addrow .time-wrap .tbtn:focus-visible{background:transparent;color:inherit}
.time-wrap.is-empty .tbtn{color:rgba(var(--ink-rgb),.32);letter-spacing:.04em}
/* ---------- paper time picker (오전·오후 / 시 / 분) ---------- */
/* the three columns are plain .ywheel wheels with .titem rows; the wheel, band and
   fade come from the year wheel, so only the widths and the 오전·오후 type differ */
.tpop-scrim{position:fixed;inset:0;z-index:70;display:none}
.tpop-scrim.on{display:block}
.tpop{position:fixed;left:0;top:0;z-index:71;display:none;background:var(--paper);border:1px solid var(--hair);box-shadow:0 18px 40px rgba(0,0,0,.18);animation:fade .16s ease}
.tpop.on{display:block}
.twrap{position:relative;display:flex}
.tcol{width:46px}
.tcol.ap{width:60px}
.tcol+.tcol{border-left:1px solid var(--dash)}
.titem{font-size:calc(15px*var(--fs-k));letter-spacing:.04em}
.tcol.ap .titem{font-family:var(--ui);font-style:normal;font-size:calc(12.5px*var(--fs-k));letter-spacing:.02em}
.tfoot{display:flex;border-top:1px solid var(--hair)}
.tfoot button{flex:1 1 50%;height:34px;font-family:var(--ui);font-size:calc(12px*var(--fs-k));letter-spacing:.04em;background:transparent;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tfoot button+button{border-left:1px solid var(--hair)}
.tfoot button:hover,.tfoot button:focus-visible{background:var(--soft)}
.tfoot button.ok{font-weight:600}
.addrow input[type=text]{flex:1 1 auto;height:36px;font-size:calc(13px*var(--fs-k));border-bottom:1px solid var(--dash);padding:0;min-width:0}
.addrow button{height:36px;display:inline-flex;align-items:center;flex:0 0 auto;font-family:var(--disp);font-style:italic;font-weight:600;font-size:calc(14px*var(--fs-k));letter-spacing:.05em;padding:0 12px;border:1px solid var(--hair)}
.addrow button:hover{background:var(--ink);color:var(--paper)}
.empty{font-size:calc(12px*var(--fs-k));opacity:.45;padding:18px 0}
.empty-note{font-size:calc(11.5px*var(--fs-k));opacity:.5;margin-top:16px;line-height:1.6}

/* ---------- detected 전화 · 메일 · 주소 ----------
   A number she wrote in a title, an item or a memo body is a dotted-underlined
   token inside the sentence. A memo writes in a <textarea> while the pen is out,
   and at rest shows the same text on the same ruled rhythm (div.mview), so the
   tokens sit right on the paper. All of them open one paper action sheet. */
.tok{border:0;background:none;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit;line-height:inherit;text-align:left;cursor:pointer;
  text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px;
  text-decoration-color:rgba(var(--ink-rgb),.5);-webkit-tap-highlight-color:transparent;border-radius:2px}
.tok:hover,.tok:focus-visible{background:var(--soft);text-decoration-style:solid}
/* a memo at rest: the identical type on the identical rhythm as its <textarea>,
   so putting the pen down or picking it up never moves the sheet */
.mview{position:relative;display:block;min-height:calc(var(--rh)*16);padding:0;letter-spacing:.005em;
  white-space:pre-wrap;overflow-wrap:break-word;cursor:text;-webkit-tap-highlight-color:transparent}
.mview .mph{color:rgba(var(--ink-rgb),.32)}
/* a checklist item at rest: its text reads like the title of an event, and a
   tap opens the line for typing */
.ctext.cview{display:block;cursor:text;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}

/* ---------- paper action sheet: 전화 · 문자 · 메일 · 지도 · 연락처 ---------- */
.scrim.ascrim{z-index:80}
.modal.amodal{width:min(430px,100%);padding:22px 22px 16px}
.amodal .akind{font-family:var(--disp);font-style:italic;font-size:calc(10.5px*var(--fs-k));letter-spacing:.24em;opacity:.55}
.amodal .aval{font-weight:600;font-size:calc(23px*var(--fs-k));line-height:1.3;letter-spacing:.005em;margin:4px 0 0;overflow-wrap:anywhere;word-break:keep-all}
.amodal .afield{display:flex;align-items:center;gap:9px;margin:16px 0 0;padding-bottom:6px;border-bottom:1px solid var(--dash)}
.amodal .afield .fl{flex:0 0 auto;font-family:var(--disp);font-style:italic;font-size:calc(10.5px*var(--fs-k));letter-spacing:.12em;opacity:.62}
.amodal .afield input{flex:1 1 auto;min-width:0;height:26px;font-size:calc(13px*var(--fs-k));padding:0;background:transparent}
.aacts{margin:16px 0 0;border-top:1px solid var(--hair)}
.arow{display:flex;align-items:center;gap:11px;width:100%;padding:13px 2px;border:0;border-bottom:1px solid rgba(var(--ink-rgb),.16);
  background:none;color:inherit;font-size:calc(13.5px*var(--fs-k));letter-spacing:.01em;text-align:left;text-decoration:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.arow svg{width:calc(16px*var(--fs-k));height:calc(16px*var(--fs-k));flex:0 0 auto;opacity:.62}
.arow .al{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .ag{font-size:calc(12px*var(--fs-k));opacity:.38}
.arow:hover,.arow:focus-visible{background:var(--soft)}
.arow.primary .al{font-weight:600}
.arow.copied .al{opacity:.55}

/* ---------- a series occurrence: 이 날만 · 전체 반복 ---------- */
.rchoice{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 0 9px 25px;padding:2px 0 9px;animation:fade .14s ease}
.rchoice .rcl{flex:1 0 100%;font-size:calc(11px*var(--fs-k));letter-spacing:.01em;opacity:.6}
.rcb{font-family:var(--ui);font-size:calc(11.5px*var(--fs-k));line-height:1;padding:7px 11px;border:1px solid rgba(var(--ink-rgb),.36);border-radius:999px;opacity:.85;background:transparent;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rcb:hover,.rcb:focus-visible{background:var(--soft);opacity:1}
.rcb.ghost{border-color:transparent;opacity:.5}
/* ---------- Google Docs 자동 백업 status ---------- */
.autostatus{font-size:calc(10.5px*var(--fs-k));letter-spacing:.02em;opacity:.55;margin-top:1px;padding:0 1px}

/* docs preview */
.doc-sheet{background:#fff;color:#202124;padding:38px 40px;border-radius:2px;font-family:'Liberation Sans',Arial,'Helvetica Neue','Noto Sans KR',sans-serif;font-size:12.5px;line-height:1.65;box-shadow:0 1px 3px rgba(0,0,0,.14),0 6px 18px rgba(0,0,0,.06);max-height:52dvh;overflow-y:auto}
.doc-sheet *{font-family:inherit}
.doc-sheet h1{font-size:21px;font-weight:400;margin:0 0 6px;letter-spacing:-.01em}
.doc-sheet .doc-sub{color:#5f6368;font-size:11px;margin-bottom:20px}
.doc-sheet h2{font-size:14px;font-weight:700;color:#1a73e8;margin:20px 0 6px}
.doc-sheet h3{font-size:12px;font-weight:700;margin:12px 0 3px;color:#202124}

function parseRoute(){

  const p = h.split('/').filter(Boolean);
  if(!p.length) return S.visited ? {view:'monthly', month:todayMonth()} : {view:'cover'};
  if(p[0]==='cover') return {view:'cover'};
  if(p[0]==='monthly') return {view:'monthly', month: p[1]? Math.min(12,Math.max(1,parseInt(p[1],10)||1)) : 1};
  if(p[0]==='yearly') return {view:'yearly'};
  if(p[0]==='memo') return {view:'memo', memoId: p[1]||null};
  if(p[0]==='backup') return {view:'backup'};
  return {view:'monthly', month:1};
}

/* ---------------- recurring events ---------------- */
/* an event carries repeat: 'none' | 'weekly' | 'monthly' | 'yearly' (default none).
   One series keeps a single object; every date it lands on is an occurrence, and a
   recurring occurrence is ticked through doneDates[date] so checking one week never
   ticks the next. */
const REPEATS = [['none','없음'],['weekly','매주'],['monthly','매월'],['yearly','매년']];
const repeatOf = ev => { const r = ev && ev.repeat; return (r==='weekly'||r==='monthly'||r==='yearly') ? r : 'none'; };
const repeatLabel = ev => { const r = repeatOf(ev); return r==='none' ? '' : (r==='weekly' ? '매주' : r==='monthly' ? '매월' : '매년'); };
const repeatRRULE = ev => ({weekly:'RRULE:FREQ=WEEKLY', monthly:'RRULE:FREQ=MONTHLY', yearly:'RRULE:FREQ=YEARLY'}[repeatOf(ev)] || '');
function repeatFromGoogle(it){
  const rec = Array.isArray(it && it.recurrence) ? it.recurrence.join(' ') : '';
  const m = rec.match(/FREQ=(DAILY|WEEKLY|MONTHLY|YEARLY)/i);
  if(!m) return null;
  const f = m[1].toUpperCase();
  return f==='WEEKLY' ? 'weekly' : f==='MONTHLY' ? 'monthly' : f==='YEARLY' ? 'yearly' : null;
}
/* does this event land on this date? only dates on or after its own count */
function occursOn(ev, ds){
  if(!ev || !ev.date || !ds) return false;
  /* a 회차 she set aside with 이 날면 is not a date the series lands on */
  if(Array.isArray(ev.skipDates) && ev.skipDates.indexOf(ds) >= 0) return false;
  const r = repeatOf(ev);
  if(r === 'none') return ev.date === ds;
  if(ds < ev.date) return false;
  const ey = +ev.date.slice(0,4), em = +ev.date.slice(5,7), ed = +ev.date.slice(8,10);
  const y = +ds.slice(0,4), m = +ds.slice(5,7), d = +ds.slice(8,10);
  if(r === 'weekly') return (dayNum(ds) - dayNum(ev.date)) % 7 === 0;
  if(r === 'monthly') return d === ed && (y*12 + m) >= (ey*12 + em);
  return m === em && d === ed && y >= ey;
}
/* the next occurrence after ds; a monthly 29/30/31 skips the months that have no
   such day (Feb 30 never exists), a yearly Feb 29 waits for the next leap year */
function nextOccurrence(ev, ds){
  const r = repeatOf(ev);
  if(r === 'weekly') return isoFromDay(dayNum(ds) + 7);
  if(r === 'monthly'){
    const d = +ds.slice(8,10);
    let y = +ds.slice(0,4), m = +ds.slice(5,7);

      if(d <= daysInMonth(y,m)) return iso(y,m,d);
    }
    return null;
  }
  if(r === 'yearly'){
    const m = +ds.slice(5,7), d = +ds.slice(8,10);
    let y = +ds.slice(0,4);
    for(let i=0;i<4;i++){
      y++;

    }
    return null;
  }

function nextOnOrAfter(ev, from){

  else if(r === 'weekly'){

      if(settled) return; settled = true; clearTimeout(timer);
      const err = new Error(msg); err.toasted = !!toasted; reject(err);
    };
    try{
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPES,
        callback: resp => {
          if(settled) return;
          if(!resp || resp.error || !resp.access_token){
            const msg = (resp && (resp.error_description || resp.error)) || 'Google 인증에 실패했습니다';
            toast(msg); return fail(msg, true);
          }
          settled = true; clearTimeout(timer);
          gToken = {access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600)*1000};
          try{ sessionStorage.setItem(GOOGLE_TOKEN_KEY, JSON.stringify(gToken)); }catch(e){}
          resolve(gToken.access_token);
        },
        error_callback: err => {
          const type = (err && err.type) || 'gis_error';
          const msg = /popup_closed|popup_failed_to_open/.test(type)
            ? 'Google 로그인 창이 닫혔습니다.' : AUTH_FAIL_MSG;
          toast(msg); fail(type, true);
        }
      });
      timer = setTimeout(()=>fail('Google 인증 응답이 없습니다. 다시 시도해 주세요.', true), 120000);
      client.requestAccessToken(prompt ? {prompt} : {});
    }catch(e){ fail(e && e.message ? e.message : String(e)); }
  });
}

async function googleFetch(url, token, init){
  const opts = Object.assign({}, init || {});
  opts.headers = Object.assign({'Authorization':'Bearer ' + token}, (init && init.headers) || {});
  const res = await fetch(url, opts);
  if(!res.ok){
    let detail = '';
    try{ const j = await res.json(); detail = (j.error && (j.error.message || j.error)) || j.error_description || ''; }catch(e){}
    const err = new Error('HTTP ' + res.status + (detail ? ' · ' + detail : ''));
    err.status = res.status;
    throw err;
  }
  return res;
}

async function googleEmail(token){
  const res = await googleFetch('https://www.googleapis.com/oauth2/v3/userinfo', token);
  const j = await res.json();
  return (j && j.email) || '';
}

/* connect / switch the real Google account and remember who it is */
async function connectGoogleAccount(opts){
  opts = opts || {};
  const token = await ensureGoogleToken({
    force: !!opts.switch,
    prompt: opts.switch ? 'select_account' : (S.google.connected ? '' : 'consent')
  });
  let email = '';
  try{ email = await googleEmail(token); }catch(e){}
  if(email){
    if(S.google.account && S.google.account !== email){
      /* the stored google ids belong to the previous account's calendar */
      S.events.forEach(e=>{ if(e.googleId) e.googleId = null; });
      S.google.calendars = [];                 /* and so does the calendar list */
      toast('Google 계정이 바뀌었습니다 · 새 계정 기준으로 다시 맞춥니다');
    }

  }

}

function googleError(err){
  if(!err || err.toasted) return;
  const msg = String(err.message || err);
  if(err.status === 401){
    clearToken();
    toast('Google 인증이 만료되었습니다. 다시 연결해 주세요.');
    return;
  }
  if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
    toast('네트워크 문제로 Google에 연결하지 못했습니다.');
    return;
  }

/* ---------- Google Calendar: two-way, one calendar or several ---------- */
const CAL_LIST = 'https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=250';
const CAL_BASE = 'https://www.googleapis.com/calendar/v3/calendars/';
const CAL_SLOTS = 5;                                   /* --cal-c0 … --cal-c4 */
const calList = () => (S.google && Array.isArray(S.google.calendars)) ? S.google.calendars : [];
/* 'primary' is how the API spells her own calendar, and how its events are stored */
const calApiId = cid => (cid && cid !== 'primary') ? cid : 'primary';
function calById(cid){
  const list = calList();
  if(!cid || cid === 'primary') return list.find(c=>c.primary) || null;
  return list.find(c=>c.id === cid) || null;
}
const eventCalId = ev => calApiId(ev && ev.calendarId);
/* the --cal-c slot a secondary calendar paints with; null = the theme's own ink */
function calSlot(cid){
  const c = calById(cid);
  if(!c || c.primary || !(c.colorIdx >= 0)) return null;
  return c.colorIdx % CAL_SLOTS;
}
/* the colour a secondary/shared calendar paints with: her own RGB pick
   (customColor) first, then the theme's --cal-c slot; null = the theme's ink */
function calColorOf(c){
  if(!c || c.primary) return null;
  if(c.customColor) return c.customColor;
  if(c.colorIdx >= 0) return `var(--cal-c${c.colorIdx % CAL_SLOTS})`;
  return null;
}
/* the same colour as a hex value, for the paper swatch grid */
function calHexOf(c){
  if(!c || c.primary) return null;
  if(c.customColor) return c.customColor;
  const vars = ['--cal-c' + (c.colorIdx >= 0 ? c.colorIdx % CAL_SLOTS : 0), '--ink'];
  for(const v of vars){
    const got = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    if(/^#[0-9a-fA-F]{6}$/.test(got)) return got;
  }
  return '#4B648C';
}
/* ---------- a shared calendar's colour: the app's own colour grid ----------
   8 hues across (coral · amber · olive · sage · steel · indigo · plum · wood)
   by 5 tones down, muted at the top, deep at the bottom. Every one is a real
   ink that reads on the planner's paper. No spectrum, no slider, no eyedropper. */

  '#c16654', '#a6763d', '#81843f', '#508b73', '#5c83ae', '#767bb6', '#a86ba3', '#9b795f',

  '#ac432e', '#895b24', '#666829', '#377058', '#3e6797', '#555db3', '#924b8c', '#805e45',
  '#943a27', '#754f1f', '#585a23', '#2f604c', '#355982', '#484fa0', '#7d4178', '#6e513b'
];
let calPopAnchor = null;
function closeCalPop(){
  const pop = document.getElementById('calpop');
  if(calPopAnchor) calPopAnchor.classList.remove('on');
  calPopAnchor = null;
  if(!pop) return;
  pop.classList.remove('on');

function openCalColorPop(cid, anchor){
  const c = calList().find(x=>x.id === cid);
  const pop = document.getElementById('calpop');
  if(!c || !pop || !anchor) return;
  const cur = String(c.customColor || '').toLowerCase();
  pop.innerHTML = CAL_PALETTE.map(h=>`<button type="button" class="gsw${h === cur ? ' on' : ''}" data-act="cal-color" data-val="${esc(cid)}" data-hex="${h}" style="--c:${h}" aria-label="${esc(calName(cid))} ${h}" title="${h}"></button>`).join('');
  /* measured while invisible, then pinned beside its dot and kept whole inside
     the viewport — a phone must never see it clipped or half off-screen */
