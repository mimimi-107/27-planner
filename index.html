/* ---------------- year wheel ---------------- */
/* a paper wheel just above the bottom bar: tap, drag (mouse/pen) or flick (touch)
   through the years, the centred row applies straight away */
const YROW = 38;
const ypop = document.getElementById('ypop');
const ypopLayer = document.getElementById('ypop-layer');
const ywheel = document.getElementById('ywheel');
let ywheelOpen = false, ywheelDrag = null, ywheelSuppress = false, ywheelTimer = null;

function buildWheel(){
  let html = '<div class="ypad"></div>';
  for(let y = YEAR_MIN; y <= YEAR_MAX; y++){
    html += `<div class="yitem${y===S.year?' on':''}" role="option" aria-selected="${y===S.year}" data-year="${y}">${y}</div>`;
  }
  ywheel.innerHTML = html + '<div class="ypad"></div>';
}
function wheelIndex(){
  return Math.max(0, Math.min(YEAR_MAX-YEAR_MIN, Math.round(ywheel.scrollTop / YROW)));
}
function paintWheel(){
  const i = wheelIndex();
  ywheel.querySelectorAll('.yitem').forEach((el,n)=>{
    el.classList.toggle('on', n===i);
    el.setAttribute('aria-selected', n===i ? 'true' : 'false');
  });
}
function openYearWheel(anchor){
  buildWheel();
  ywheelOpen = true;
  ypopLayer.classList.add('on');
  document.getElementById('ypop-scrim').classList.add('on');
  const bar = anchor || document.querySelector('.yearbar') || document.querySelector('.cover-yearsw');
  const r = bar ? bar.getBoundingClientRect() : {top: window.innerHeight - 60};
  ypopLayer.style.paddingBottom = Math.max(10, Math.round(window.innerHeight - r.top + 8)) + 'px';
  ywheel.scrollTop = (Math.max(YEAR_MIN, Math.min(YEAR_MAX, S.year)) - YEAR_MIN) * YROW;
  paintWheel();
  try{ ywheel.focus({preventScroll:true}); }catch(err){}
}
function closeYearWheel(){
  ywheelOpen = false;
  ypopLayer.classList.remove('on');
  document.getElementById('ypop-scrim').classList.remove('on');
}
/* bring the inline editor into view after picking or creating an item on a phone */
function revealInlineEditor(){
  const ed = document.querySelector('.minline .editor');
  if(ed) requestAnimationFrame(()=>{ try{ ed.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(err){ ed.scrollIntoView(); } });
}
function applyWheelYear(y){
  if(y === S.year) return;
  S.year = y; persist(true); render();
}
ywheel.addEventListener('scroll', ()=>{
  paintWheel();
  clearTimeout(ywheelTimer);
  ywheelTimer = setTimeout(()=>{ if(ywheelOpen) applyWheelYear(YEAR_MIN + wheelIndex()); }, 130);
}, {passive:true});
ywheel.addEventListener('click', e=>{
  const it = e.target.closest('.yitem');
  if(!it || ywheelSuppress) return;
  const y = Number(it.dataset.year);
  closeYearWheel();
  applyWheelYear(y);
  if(y === S.year) render();
});
/* mouse and pen drag their way down the wheel; touch keeps the browser's own
   momentum scrolling and snap. The pointer is captured only once the drag has
   actually moved — capturing on pointerdown retargeted the following click to
   the wheel itself, so a plain mouse click on a year did nothing. */
ywheel.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'touch') return;
  ywheelDrag = {y:e.clientY, top:ywheel.scrollTop, moved:false, id:e.pointerId, captured:false};
  ywheel.classList.add('grab');
});
ywheel.addEventListener('pointermove', e=>{
  if(!ywheelDrag) return;
  const dy = e.clientY - ywheelDrag.y;
  if(!ywheelDrag.moved && Math.abs(dy) > 4){
    ywheelDrag.moved = true;
    try{ ywheel.setPointerCapture(ywheelDrag.id); ywheelDrag.captured = true; }catch(err){}
  }
  if(ywheelDrag.moved){ e.preventDefault(); ywheel.scrollTop = ywheelDrag.top - dy; }
});
function endWheelDrag(){
  if(!ywheelDrag) return;
  const moved = ywheelDrag.moved;
  ywheelDrag = null;
  ywheel.classList.remove('grab');
  if(moved){
    ywheelSuppress = true;
    ywheel.scrollTo({top: wheelIndex()*YROW, behavior:'smooth'});
    setTimeout(()=>{ ywheelSuppress = false; }, 320);
  }
}
ywheel.addEventListener('pointerup', endWheelDrag);
ywheel.addEventListener('pointercancel', endWheelDrag);
window.addEventListener('pointerup', e=>{ if(ywheelDrag && ywheelDrag.moved) endWheelDrag(); });
ywheel.addEventListener('keydown', e=>{
  if(e.key==='Escape' || e.key==='Enter'){ e.preventDefault(); closeYearWheel(); return; }
  if(e.key==='ArrowUp' || e.key==='ArrowDown'){
    e.preventDefault();
    const i = wheelIndex() + (e.key==='ArrowUp' ? -1 : 1);
    ywheel.scrollTo({top: Math.max(0, Math.min(YEAR_MAX-YEAR_MIN, i))*YROW, behavior:'smooth'});
  }
});

/* ---------------- paper time picker ---------------- */
/* a 3-wheel paper picker (오전·오후 / 1–12 / 00–59) in the year wheel's paper, so a
   time is chosen in the app instead of iOS's white/blue system sheet. The wheels
   scroll-snap exactly like .ywheel; 확인 writes HH:MM into the row's button,
   비우기 takes the time away and leaves --:-- */
const TROW = 38;
const TAP_ITEMS = ['오전','오후'];
const TH_ITEMS = Array.from({length:12}, (_,i)=>String(i+1));
const TM_ITEMS = Array.from({length:60}, (_,i)=>String(i).padStart(2,'0'));
/* the two rows' times live here, not in a form field */
let editTime = '', newTime = '';
let tpopOpen = false, tpopTarget = null, tpopAnchor = null;
const tpopEl = document.getElementById('tpop');
const tpopScrim = document.getElementById('tpop-scrim');
const tcols = {
  ap: document.getElementById('tcol-ap'),
  hh: document.getElementById('tcol-hh'),
  mm: document.getElementById('tcol-mm')
};
function tcolFill(col, items){
  col.innerHTML = '<div class="ypad"></div>' + items.map((v,i)=>`<div class="yitem titem" role="option" data-i="${i}">${v}</div>`).join('') + '<div class="ypad"></div>';
}
tcolFill(tcols.ap, TAP_ITEMS);
tcolFill(tcols.hh, TH_ITEMS);
tcolFill(tcols.mm, TM_ITEMS);

function tCount(col){ return col.children.length - 2; }
function tIdxOf(col){
  return Math.max(0, Math.min(tCount(col)-1, Math.round(col.scrollTop / TROW)));
}
function tPaintCol(col){
  const i = tIdxOf(col);
  col.querySelectorAll('.titem').forEach((el,n)=>{
    el.classList.toggle('on', n===i);
    el.setAttribute('aria-selected', n===i ? 'true' : 'false');
  });
}
function tPaintAll(){ Object.keys(tcols).forEach(k=>tPaintCol(tcols[k])); }

/* touch keeps the browser's momentum scrolling and snap; mouse and pen drag */
Object.keys(tcols).forEach(key=>{
  const col = tcols[key];
  let drag = null;
  col.addEventListener('scroll', ()=>{ tPaintCol(col); }, {passive:true});
  col.addEventListener('click', e=>{
    const it = e.target.closest('.titem');
    if(!it || col.dataset.suppress) return;
    col.scrollTo({top: Number(it.dataset.i) * TROW, behavior:'smooth'});
  });
  col.addEventListener('pointerdown', e=>{
    if(e.pointerType === 'touch') return;
    drag = {y:e.clientY, top:col.scrollTop, moved:false, id:e.pointerId};
    col.classList.add('grab');
  });
  col.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dy = e.clientY - drag.y;
    if(!drag.moved && Math.abs(dy) > 4){
      drag.moved = true;
      try{ col.setPointerCapture(drag.id); }catch(err){}
    }
    if(drag.moved){ e.preventDefault(); col.scrollTop = drag.top - dy; }
  });
  const endDrag = ()=>{
    if(!drag) return;
    const moved = drag.moved;
    drag = null;
    col.classList.remove('grab');
    if(moved){
      col.dataset.suppress = '1';
      col.scrollTo({top: tIdxOf(col) * TROW, behavior:'smooth'});
      setTimeout(()=>{ delete col.dataset.suppress; }, 320);
    }
  };
  col.addEventListener('pointerup', endDrag);
  col.addEventListener('pointercancel', endDrag);
  window.addEventListener('pointerup', ()=>{ if(drag && drag.moved) endDrag(); });
  col.addEventListener('keydown', e=>{
    if(e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const i = tIdxOf(col) + (e.key === 'ArrowUp' ? -1 : 1);
    col.scrollTo({top: Math.max(0, Math.min(tCount(col)-1, i)) * TROW, behavior:'smooth'});
  });
});

function tSelected(){
  const ap = tIdxOf(tcols.ap), h12 = tIdxOf(tcols.hh) + 1, mm = tIdxOf(tcols.mm);
  let H = h12 % 12;
  if(ap === 1) H += 12;
  return String(H).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
function setTimeValue(target, time){
  if(target === 'edit') editTime = time; else newTime = time;
  const b = document.getElementById(target === 'edit' ? 'edittime' : 'newtime');
  if(!b) return;
  b.textContent = time ? fmtTime(time) : '--:--';
  const w = b.closest('.time-wrap');
  if(w) w.classList.toggle('is-empty', !time);
}
function openTimePop(target, anchor){
  const cur = target === 'edit' ? editTime : newTime;
  let ap, h12, mm;
  if(cur){
    const [H, M] = cur.split(':').map(Number);
    ap = H < 12 ? 0 : 1;
    h12 = H % 12 === 0 ? 12 : H % 12;
    mm = M;
  } else {
    /* an empty cell opens on the current clock time, so 확인 is one tap */
    const now = new Date(), H = now.getHours();
    ap = H < 12 ? 0 : 1;
    h12 = H % 12 === 0 ? 12 : H % 12;
    mm = now.getMinutes();
  }
  tpopTarget = target;
  tpopAnchor = anchor;
  tpopOpen = true;
  tpopEl.classList.add('on');
  tpopScrim.classList.add('on');
  /* it is laid out now, so its real size is known before placing it */
  const w = tpopEl.offsetWidth, h = tpopEl.offsetHeight;
  const r = anchor.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = Math.min(Math.max(10, r.left), Math.max(10, vw - 10 - w));
  let top = r.bottom + 8;
  if(top + h > vh - 10) top = r.top - 8 - h;
  if(top < 10) top = Math.max(10, vh - 10 - h);
  tpopEl.style.left = Math.round(left) + 'px';
  tpopEl.style.top = Math.round(top) + 'px';
  tcols.ap.scrollTop = ap * TROW;
  tcols.hh.scrollTop = (h12 - 1) * TROW;
  tcols.mm.scrollTop = mm * TROW;
  tPaintAll();
  /* scrolling the Day Modal would leave the panel behind, so it closes instead */
  const m = document.querySelector('#modal-root .modal');
  if(m) m.addEventListener('scroll', closeTimePop, {once:true, passive:true});
  try{ tcols.hh.focus({preventScroll:true}); }catch(err){}
}
function closeTimePop(){
  if(!tpopOpen) return;
  tpopOpen = false;
  tpopTarget = null;
  tpopAnchor = null;
  tpopEl.classList.remove('on');
  tpopScrim.classList.remove('on');
}
tpopScrim.addEventListener('click', closeTimePop);
tpopEl.addEventListener('click', e=>{
  const b = e.target.closest('[data-tact]');
  if(!b) return;
  if(b.dataset.tact === 'clear') setTimeValue(tpopTarget, '');
  else setTimeValue(tpopTarget, tSelected());
  closeTimePop();
});
window.addEventListener('resize', closeTimePop);

document.addEventListener('click', e=>{
  if(!e.target.closest('#fab') && !e.target.closest('#palette-pop')) document.getElementById('palette-pop').classList.remove('on');
  const calpop = document.getElementById('calpop');
  if(calpop.classList.contains('on') && !e.target.closest('#calpop') && !e.target.closest('[data-act="cal-color-open"]')) closeCalPop();
  if(ywheelOpen && !e.target.closest('#ypop') && !e.target.closest('[data-act="year-pick"]')) closeYearWheel();
});

window.addEventListener('hashchange', setRoute);

/* boot: a fresh launch (no route hash, e.g. the Home Screen app) always
   opens on today's year and month, whatever year was last looked at */
if(!location.hash || location.hash === '#'){
  if(S.visited){
    S.year = todayYear();
    S.lastMonth = todayMonth();
    persist(true);
    location.replace('#/monthly/' + S.lastMonth);
  }
  else { location.replace('#/cover'); }
}
setRoute();
/* the 자동 백업 line under Google Docs로 백업 keeps its "방금 · 3분 전" reading */
setInterval(paintAutoStatus, 30000);

/* ---------- PWA: offline service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .catch(err=>console.warn('[27] service worker registration failed:', err));
  });
}
</script>
